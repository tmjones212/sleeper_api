<div class="player-card">
    <div style="margin-bottom: 15px;">
        <img alt="{{PLAYER_NAME}}" 
             onerror="this.style.display='none'" 
             src="{{PLAYER_IMAGE_URL}}" 
             style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid #66ccff; object-fit: cover;"/>
    </div>
    <h3>{{PLAYER_NAME}}</h3>
    <div class="trade-count">{{TRADE_COUNT}}</div>
    <p>trades</p>
</div>
