<!-- Trade Details Modal -->
<div class="trade-modal" id="tradeModal">
    <div class="trade-modal-content">
        <span class="trade-modal-close">×</span>
        <div id="tradeModalContent"></div>
    </div>
</div>

<!-- Matchup Breakdown Modal -->
<div id="breakdownModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: #2d2d2d; margin: 5% auto; padding: 30px; border-radius: 15px; width: 80%; max-width: 900px; max-height: 80%; overflow-y: auto; position: relative; color: #e0e0e0;">
        <span onclick="closeBreakdownModal()" style="position: absolute; top: 15px; right: 25px; font-size: 28px; font-weight: bold; cursor: pointer; color: #b0b0b0;">&times;</span>
        <h2 id="modalTitle" style="margin-bottom: 20px; color: #66ccff;">Matchup Breakdown</h2>
        <div id="modalContent"></div>
    </div>
</div>
