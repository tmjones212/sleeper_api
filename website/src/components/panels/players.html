<div class="visualization-panel" id="players-panel">
    <div class="panel-header">
        <h2>👤 Player Journey Tracker</h2>
        <p>Track any player's journey through teams</p>
    </div>
    <div class="panel-content">
        <div class="search-container">
            <input type="text" id="player-search" class="search-input" placeholder="Enter player name..." onkeypress="if(event.key==='Enter') searchPlayerJourney()">
            <button class="search-button" onclick="searchPlayerJourney()">Search</button>
        </div>
        
        <div id="player-suggestions" style="margin: 10px auto; max-width: 600px; text-align: center;"></div>
        
        <div id="player-journey-results" class="player-journey-container">
            <!-- Player journey results will appear here -->
        </div>
    </div>
</div>
