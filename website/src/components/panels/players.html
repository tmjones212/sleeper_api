<div class="visualization-panel" id="players-panel">
    <div class="panel-header">
        <h2>👤 Player Journey Tracker</h2>
        <p>Track how individual players have moved between teams</p>
    </div>
    <div class="panel-content">
        <div class="search-container">
            <input type="text" class="search-input" id="playerSearch" placeholder="Enter player name...">
            <button class="search-button" onclick="searchPlayerJourney()">Track Journey</button>
        </div>
        
        <div class="player-journey-container" id="playerJourneyResult"></div>
    </div>
</div>
