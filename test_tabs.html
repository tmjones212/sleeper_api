<!DOCTYPE html>
<html>
<head>
    <title>Test Tabs</title>
    <style>
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            background: #2d2d2d;
            border-radius: 5px;
        }
        .pass {
            color: #4CAF50;
        }
        .fail {
            color: #f44336;
        }
    </style>
</head>
<body>
    <h1>Tab Display Test</h1>
    <div id="results"></div>
    
    <script>
        function testTabs() {
            const results = [];
            
            // Test 1: Check if panels exist
            const panels = ['overview', 'network', 'matrix', 'timeline', 'players', 'matchups', 'draft'];
            panels.forEach(panelName => {
                const panel = parent.document.getElementById(panelName + '-panel');
                if (panel) {
                    results.push({
                        test: `Panel ${panelName} exists`,
                        pass: true,
                        details: `Found panel with id="${panelName}-panel"`
                    });
                } else {
                    results.push({
                        test: `Panel ${panelName} exists`,
                        pass: false,
                        details: `Panel not found`
                    });
                }
            });
            
            // Test 2: Check showPanel function
            if (typeof parent.showPanel === 'function') {
                results.push({
                    test: 'showPanel function exists',
                    pass: true,
                    details: 'Function is defined'
                });
            } else {
                results.push({
                    test: 'showPanel function exists',
                    pass: false,
                    details: 'Function not found'
                });
            }
            
            // Test 3: Check matchups content
            const matchupsPanel = parent.document.getElementById('matchups-panel');
            if (matchupsPanel) {
                const yearMatchups = matchupsPanel.querySelectorAll('.year-matchups');
                const hasContent = Array.from(yearMatchups).some(div => {
                    const container = div.querySelector('.weeks-container');
                    return container && container.children.length > 0;
                });
                
                results.push({
                    test: 'Matchups panel has content',
                    pass: hasContent,
                    details: `Found ${yearMatchups.length} year containers, content: ${hasContent}`
                });
            }
            
            // Test 4: Check draft content
            const draftPanel = parent.document.getElementById('draft-panel');
            if (draftPanel) {
                const draftResults = draftPanel.querySelector('#draftResults');
                const hasContent = draftResults && draftResults.innerHTML.trim().length > 0;
                
                results.push({
                    test: 'Draft panel has content container',
                    pass: !!draftResults,
                    details: `Draft results container ${draftResults ? 'found' : 'not found'}`
                });
            }
            
            // Display results
            const resultsDiv = document.getElementById('results');
            results.forEach(result => {
                const div = document.createElement('div');
                div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
                div.innerHTML = `
                    <strong>${result.pass ? '✓' : '✗'} ${result.test}</strong><br>
                    <small>${result.details}</small>
                `;
                resultsDiv.appendChild(div);
            });
        }
        
        // Run tests when loaded in iframe
        if (window.parent !== window) {
            testTabs();
        } else {
            document.getElementById('results').innerHTML = '<p>Please open index.html and run this test from the browser console using:</p><pre>const iframe = document.createElement("iframe"); iframe.src = "test_tabs.html"; iframe.style.width = "100%"; iframe.style.height = "400px"; document.body.appendChild(iframe);</pre>';
        }
    </script>
</body>
</html>
